name: daily-settle
# 答え合わせ（Gemini作成、Claude確認）。前日分の取得（daily-fetch）が終わった直後に起動される。
# 定期実行は保険（JST 15:30）。結果が未取得なら見送る。
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      date: { description: "対象日 (YYYY-MM-DD、カンマ区切りで複数可)。省略時はJSTの前日", required: false, type: string }
concurrency: { group: autorace-settle, cancel-in-progress: false }
permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { PYTHONPATH: "." }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -q -r requirements.txt
      - name: rclone
        env: { RCLONE_CONFIG_CONTENT: "${{ secrets.RCLONE_CONFIG }}" }
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: 対象日
        env: { INPUT_DATE: "${{ inputs.date }}" }
        run: |
          DS="${INPUT_DATE:-$(TZ=Asia/Tokyo date -d yesterday +%Y-%m-%d)}"
          for D in ${DS//,/ }; do [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "日付の形が不正: $D"; exit 1; }; done
          echo "TARGET_DATES=${DS//,/ }" >> "$GITHUB_ENV"
      - name: Driveからデータを取得
        run: |
          for t in program race_result race_info refund program_pre odds_pre tracker; do
            rclone copy "gdrive:autorace-predictor/data/$t" "data/$t" || true
          done
          # 本番用の予想（fit_live_model が作る）。無ければ settle_daily は v0 を使う
          rclone copy "gdrive:autorace-predictor/models/live" "data/models/live" || true
          for D in $TARGET_DATES; do rclone copy "gdrive:autorace-predictor/data/odds/${D:0:4}/${D:0:7}.parquet" "data/odds/${D:0:4}/" || true; done
      - name: 答え合わせ
        run: for D in $TARGET_DATES; do python -m autorace.scripts.settle_daily --date "$D"; done
      - name: Driveへ保存
        if: always()
        run: '[ -d data/tracker ] && rclone copy data/tracker gdrive:autorace-predictor/data/tracker || true'
