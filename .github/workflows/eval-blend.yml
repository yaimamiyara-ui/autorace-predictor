name: eval-blend
# v1 と市場（オッズ）の Benter 合成を評価（手動）。学習60%・合成の当てはめ15%・テスト25%。ログは集計値だけ。
on:
  workflow_dispatch:
concurrency: { group: autorace-model, cancel-in-progress: false }
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env: { PYTHONPATH: "${{ github.workspace }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - name: rclone
        env: { RCLONE_CONFIG_CONTENT: "${{ secrets.RCLONE_CONFIG }}" }
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Driveからデータを取得
        run: rclone copy gdrive:autorace-predictor/data data --include "program/**" --include "race_result/**" --include "race_info/**" --include "odds/**" --include "refund/**" --include "odds_pre/**"
      - name: 評価
        run: python -m autorace.scripts.eval_blend --data-dir data --out out/eval_blend.json
      - name: 結果をDriveへ保存
        if: always()
        run: '[ -d out ] && rclone copy out gdrive:autorace-predictor/models/eval_blend || true'
