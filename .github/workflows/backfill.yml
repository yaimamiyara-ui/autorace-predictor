name: backfill
# 過去データの一括取得（手動実行）。Gemini作成、Claude確認（入力値は環境変数経由に変更）
on:
  workflow_dispatch:
    inputs:
      start: { description: "開始日 (YYYY-MM-DD)", required: true, type: string }
      end: { description: "終了日 (YYYY-MM-DD)", required: true, type: string }
      places: { description: "場コード（カンマ区切り）", required: false, default: "2,3,4,5,6", type: string }
      kinds: { description: "取得する種類", required: false, default: "program,result,odds,refund", type: string }
concurrency: { group: autorace-fetch, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      START_DATE: ${{ inputs.start }}
      END_DATE: ${{ inputs.end }}
      PLACES: ${{ inputs.places }}
      KINDS: ${{ inputs.kinds }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - name: rclone
        env: { RCLONE_CONFIG_CONTENT: "${{ secrets.RCLONE_CONFIG }}" }
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: 対象月のデータをDriveから取得
        run: |
          python - <<'PY'
          import datetime, os, subprocess
          s = datetime.date.fromisoformat(os.environ["START_DATE"]); e = datetime.date.fromisoformat(os.environ["END_DATE"])
          cmd = ["rclone", "copy", "gdrive:autorace-predictor/data", "data", "--include", "_done/**"]
          c = s.replace(day=1)
          while c <= e:
              cmd += ["--include", f"*/{c:%Y}/{c:%Y-%m}.parquet"]
              c = (c.replace(day=28) + datetime.timedelta(days=4)).replace(day=1)
          subprocess.run(cmd, check=False)
          PY
      - name: 取得
        run: python -m autorace.scripts.backfill --start "$START_DATE" --end "$END_DATE" --places "$PLACES" --kinds "$KINDS" --max-minutes 330
      - name: Driveへ保存
        if: always()
        run: '[ -d data ] && rclone copy data gdrive:autorace-predictor/data || true'
