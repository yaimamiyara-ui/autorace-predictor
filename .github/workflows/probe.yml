name: probe
on:
  workflow_dispatch:
  push:
    paths: ["autorace/scripts/probe.py"]
concurrency: { group: autorace-probe, cancel-in-progress: true }
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m autorace.scripts.probe
