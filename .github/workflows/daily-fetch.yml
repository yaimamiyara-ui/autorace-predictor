name: daily-fetch
# 毎日10:07 JST（ミッドナイト開催の終了後）に前日分を取得してGoogleドライブへ保存
on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:
concurrency: { group: autorace-fetch, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  daily-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { rclone_config: "${{ secrets.RCLONE_CONFIG }}" }
      - name: 前日（日本時間）の月のデータを取得
        id: target
        run: |
          D=$(TZ=Asia/Tokyo date -d "yesterday" +%Y-%m-%d); Y=${D:0:4}; YM=${D:0:7}
          echo "date=$D" >> "$GITHUB_OUTPUT"
          rclone copy gdrive:autorace-predictor/data data --include "_done/$Y/$YM.txt" --include "*/$Y/$YM.parquet" || true
      - name: 前日分を取得
        run: |
          python -m autorace.scripts.backfill --start "${{ steps.target.outputs.date }}" \
            --end "${{ steps.target.outputs.date }}" --places 2,3,4,5,6 --max-minutes 45
      - name: Googleドライブへ保存
        if: always()
        run: if [ -d data ]; then rclone copy data gdrive:autorace-predictor/data; fi
