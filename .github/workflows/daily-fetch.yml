name: daily-fetch
# 毎日10:00 JSTに前日分を取得（ミッドナイト開催の終了後）。Gemini作成、Claude確認
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
concurrency: { group: autorace-fetch, cancel-in-progress: false }
jobs:
  daily-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { PYTHONPATH: "${{ github.workspace }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -r requirements.txt
      - name: rclone
        env: { RCLONE_CONFIG_CONTENT: "${{ secrets.RCLONE_CONFIG }}" }
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: 前日（JST）の月のデータをDriveから取得
        id: target
        run: |
          D=$(TZ=Asia/Tokyo date -d "yesterday" +%Y-%m-%d); Y=${D:0:4}; YM=${D:0:7}
          echo "date=$D" >> "$GITHUB_OUTPUT"
          rclone copy gdrive:autorace-predictor/data data --include "_done/$Y/$YM.txt" --include "*/$Y/$YM.parquet" || true
      - name: 取得
        run: python -m autorace.scripts.backfill --start "${{ steps.target.outputs.date }}" --end "${{ steps.target.outputs.date }}" --max-minutes 45
      - name: Driveへ保存
        if: always()
        run: '[ -d data ] && rclone copy data gdrive:autorace-predictor/data || true'
